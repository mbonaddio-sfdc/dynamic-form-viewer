<template>
    <lightning-card>
        <div class="slds-card__body slds-card__body_inner slds-p-top_x-small">
            <!-- Loading -->
            <template lwc:if={showSpinner}>
                <lightning-spinner
                    alternative-text="Loading..."
                    size="medium"
                ></lightning-spinner>
            </template>

            <!-- Error -->
            <template lwc:if={errorMessage}>
                <div
                    class="slds-notify slds-notify_alert slds-theme_alert-texture slds-theme_error"
                    role="alert"
                >
                    <span class="slds-assistive-text">Error</span>
                    <span
                        class="slds-icon_container slds-icon-utility-error slds-m-right_x-small"
                        title="Error icon"
                    >
                        <lightning-icon
                            icon-name="utility:error"
                            alternative-text="Error!"
                            variant="inverse"
                            size="x-small"
                        ></lightning-icon>
                    </span>
                    <h2>{errorMessage}</h2>
                </div>
            </template>

            <!-- Empty (loaded, no usable data) -->
            <template lwc:if={showEmptyState}>
                <div
                    class="slds-illustration slds-illustration_small slds-p-around_medium slds-text-align_center slds-text-color_weak"
                >
                    No application data to display.
                </div>
            </template>

            <!-- Main content -->
            <template lwc:if={hasData}>
                <lightning-layout
                    horizontal-align="stretch"
                    vertical-align="stretch"
                >
                    <!-- Left nav -->
                    <lightning-layout-item size="3" class="nav-container">
                        <lightning-vertical-navigation
                            selected-item={activeSectionKey}
                            onselect={handleSectionSelect}
                            compact
                        >
                            <template for:each={sections} for:item="section">
                                <lightning-vertical-navigation-item
                                    key={section.name}
                                    label={section.label}
                                    name={section.name}
                                ></lightning-vertical-navigation-item>
                            </template>
                        </lightning-vertical-navigation>
                    </lightning-layout-item>

                    <!-- Right content -->
                    <lightning-layout-item
                        size="9"
                        class="content-container slds-p-left_medium"
                    >
                        <lightning-tabset variant="scoped">
                            <template for:each={tabs} for:item="tab">
                                <lightning-tab
                                    key={tab.value}
                                    label={tab.label}
                                    value={tab.value}
                                >
                                    <div
                                        class="slds-p-around_medium slds-form slds-form_stacked"
                                    >
                                        <!-- Details tab: list of leaf/nested fields -->
                                        <template lwc:if={tab.isDetails}>
                                            <template
                                                for:each={tab.fields}
                                                for:item="field"
                                            >
                                                <c-dynamic-field-renderer
                                                    key={field.key}
                                                    node={field}
                                                    depth="0"
                                                ></c-dynamic-field-renderer>
                                            </template>
                                        </template>

                                        <!-- Complex tab: a single object/array node -->
                                        <template lwc:else>
                                            <c-dynamic-field-renderer
                                                node={tab.node}
                                                depth="0"
                                            ></c-dynamic-field-renderer>
                                        </template>
                                    </div>
                                </lightning-tab>
                            </template>
                        </lightning-tabset>
                    </lightning-layout-item>
                </lightning-layout>
            </template>
        </div>
    </lightning-card>
</template>
